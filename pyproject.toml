[project]
name = "alza-ai"
version = "0.1.0"
description = "Backend service for the Alza AI enablement project"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "google-cloud-firestore==2.28.1",
    "google-cloud-storage==3.13.1",
    "google-genai==2.18.1",
    "httpx==0.28.1",
    "uvicorn==0.52.3",
]

[project.scripts]
alza-ai = "alza_ai.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

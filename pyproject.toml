[project]
name = "alza-ai"
version = "0.1.0"
description = "Backend service for the Alza AI enablement project"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
